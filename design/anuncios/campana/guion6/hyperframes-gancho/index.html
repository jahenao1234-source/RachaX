<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Racha · campaña · guion 6 · el gancho</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .clip { position: absolute; inset: 0; }
      video.clip { width: 100%; height: 100%; object-fit: cover; }
      #tr { z-index: 1; overflow: visible; }
      #persona { transform-origin: 50% 30%; }
      .app-caja { position: absolute; z-index: 2; left: 280px; top: 110px; width: 520px; height: 1067px; padding: 9px; border-radius: 62px; background: #24272D; box-shadow: 0 0 0 4px #0F1113, 14px 16px 0 rgba(15, 17, 19, 0.85); opacity: 0; visibility: hidden; }
      .app-pantalla { position: relative; width: 100%; height: 100%; border-radius: 54px; overflow: hidden; background: #0F1113; }
      #tarjetas { z-index: 3; }
      #letras { z-index: 4; }
      #destello { position: absolute; inset: 0; z-index: 5; background: #FFF6E0; opacity: 0; visibility: hidden; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="5.666667" data-width="1080" data-height="1920">
      <!-- Lina, con el filtro, sin pausas y sin lo que agregó o repitió -->
      <div id="tr" class="clip" data-layout-allow-overflow><video id="persona" class="clip" src="assets/persona.mp4" playsinline muted data-start="0" data-duration="5.666667" data-media-start="0" data-track-index="0" data-layout-allow-overflow></video></div>

      <!-- La app en movimiento, en una tarjeta con forma de celular -->


      <!-- Las tarjetas, a la altura del pecho -->
      <div id="tarjetas" class="clip" data-composition-id="tarjetas" data-composition-src="compositions/tarjetas.html" data-start="0" data-duration="5.666667" data-track-index="2" data-width="1080" data-height="1920"></div>

      <!-- Subtítulos pequeños y palabras grandes -->
      <div id="letras" class="clip" data-composition-id="letras" data-composition-src="compositions/letras.html" data-start="0" data-duration="5.666667" data-track-index="3" data-width="1080" data-height="1920"></div>

      <div id="destello"></div>

      <!-- La voz de Lina -->
      <audio id="voz" src="assets/voz.wav" data-start="0" data-duration="5.666667" data-media-start="0" data-track-index="4" data-volume="1"></audio>

      <!-- Los efectos de sonido, ya mezclados -->
      <audio id="efectos" src="assets/efectos.wav" data-start="0" data-duration="5.666667" data-media-start="0" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#tr", { rotation: 6, x: 46, y: 34, scale: 1.24 }, 1.029333);
      tl.to("#tr", { rotation: -4.5, x: -34, y: -24, scale: 1.18, duration: 0.07, ease: "sine.inOut" }, 1.029333);
      tl.to("#tr", { rotation: 3, x: 22, y: 16, scale: 1.12, duration: 0.07, ease: "sine.inOut" }, 1.099333);
      tl.to("#tr", { rotation: -1.8, x: -12, y: -9, scale: 1.07, duration: 0.08, ease: "sine.inOut" }, 1.169333);
      tl.to("#tr", { rotation: 0.8, x: 5, y: 4, scale: 1.03, duration: 0.09, ease: "sine.inOut" }, 1.249333);
      tl.to("#tr", { rotation: 0, x: 0, y: 0, scale: 1, duration: 0.11, ease: "sine.inOut" }, 1.339333);
      tl.set("#persona", { scale: 1.1, y: 0 }, 1.196);
      tl.set("#persona", { scale: 1.28, y: 0 }, 4.229333);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
