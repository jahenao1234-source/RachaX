<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#050506}
.cam{position:absolute;left:-108px;top:-190px;width:1296px;height:2304px}
.cam>*{position:absolute;inset:0;width:100%;height:100%}
.amb{background:url(ambar.jpg) center/100% 100%;-webkit-mask-image:radial-gradient(ellipse 12% 8% at 73.7% 42.6%,#000 60%,transparent 100%)}
.bri{filter:blur(30px) brightness(1.2) saturate(1.15);mix-blend-mode:screen}
/* la luz del espejo: sale del vidrio, no de la foto */
.luz{background:radial-gradient(ellipse 9.2% 6.1% at 73.7% 42.4%,rgba(255,214,140,.95) 0,rgba(255,181,71,.9) 45%,rgba(255,160,40,.55) 80%,rgba(255,150,30,0) 100%);mix-blend-mode:screen}
.halo{background:radial-gradient(ellipse 30% 20% at 73.7% 42.4%,rgba(255,181,71,.42) 0,rgba(255,181,71,0) 100%);mix-blend-mode:screen}
.vin{position:absolute;inset:0;background:radial-gradient(ellipse 80% 64% at 50% 54%,transparent 42%,rgba(0,0,0,.7) 100%),linear-gradient(180deg,rgba(0,0,0,.62) 0,rgba(0,0,0,0) 560px),linear-gradient(0deg,rgba(0,0,0,.92) 0,rgba(0,0,0,0) 470px)}
.grano{position:absolute;left:-100px;top:-100px;width:1480px;height:2320px;background:url(grano.jpg);mix-blend-mode:overlay;opacity:.3}
p{position:absolute;left:0;right:0;top:300px;margin:0;text-align:center;font:600 58px/1.12 Barlow,Arial,sans-serif;letter-spacing:-.025em;color:#F4E7C3;text-shadow:0 0 3px rgba(255,236,200,.55),0 0 18px rgba(255,200,120,.5),0 2px 10px rgba(0,0,0,.9)}
</style></head><body>
<div class="cam"><img src="bn.jpg"><div class="amb"></div><div class="amb bri"></div><div class="halo"></div><div class="luz"></div></div>
<div class="vin"></div><p>en acostumbrarse<br>a su cara nueva.</p><div class="grano"></div>
</body></html>
