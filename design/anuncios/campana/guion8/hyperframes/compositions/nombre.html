<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("assets/fuentes/barlow-condensed-700.woff2") format("woff2"); }
        @font-face { font-family: "Barlow"; font-weight: 600; src: url("assets/fuentes/barlow-600.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        .fondo { position: absolute; inset: 0; }
        .col { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
        .l { margin: 0; font-family: "Barlow Condensed", sans-serif; font-weight: 700; line-height: 1; white-space: nowrap; text-transform: uppercase; text-align: center; opacity: 0; }
        .ambar { display: inline-block; background: #FFB547; color: #0F1113; padding: 2px 28px 12px; }
        .negra { display: inline-block; background: #0F1113; color: #FFB547; padding: 2px 28px 12px; }
        .caja { display: inline-block; background: #F4EFE6; color: #0F1113; padding: 0 26px 10px; border: 6px solid #0F1113; box-shadow: 8px 8px 0 #0F1113; }
        .caja.amb { background: #FFB547; }
        #n-col { top: 290px; gap: 8px; }
        #n-a { font-size: 86px; color: #0F1113; letter-spacing: 0.04em; }
        #n-b { font-size: 236px; color: #0F1113; }
        #n-c { font-size: 150px; }
        #n-v { position: absolute; left: 150px; top: 900px; width: 780px; height: 660px; overflow: hidden; border: 10px solid #0F1113; box-shadow: 18px 18px 0 #0F1113; background: #FFB547; opacity: 0; }
        #n-v img { position: absolute; left: 0; top: -60px; width: 100%; display: block; }
      </style>
      <div id="root" data-composition-id="nombre" data-width="1080" data-height="1920">
        <div class="fondo" style="background: #FFB547"></div>
        <div id="n-v" data-layout-allow-overflow><img id="n-i" src="assets/d-portada.jpg" alt="" data-layout-allow-overflow /></div>
        <div class="col" id="n-col">
          <p class="l" id="n-a">Se llama</p>
          <p class="l" id="n-b">Método</p>
          <p class="l" id="n-c"><span class="negra">Anti-Abandono</span></p>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#n-a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, 0.06);
          tl.fromTo("#n-v", { opacity: 0, y: 300, rotation: 7 }, { opacity: 1, y: 0, rotation: -2, duration: 0.42, ease: "back.out(1.3)" }, 0.05);
          tl.fromTo("#n-i", { scale: 1.16 }, { scale: 1.02, duration: 2.17, ease: "none" }, 0);
          tl.fromTo("#n-b", { opacity: 0, scale: 1.5, rotation: -8 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.18, ease: "power4.in", immediateRender: false }, 0.73);
          tl.fromTo("#n-c", { opacity: 0, scale: 1.5, rotation: -4.5 }, { opacity: 1, scale: 1, rotation: 1.5, duration: 0.18, ease: "power4.in", immediateRender: false }, 1.15);
          window.__timelines["nombre"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
