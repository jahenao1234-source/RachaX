<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(../../rimu1/hyperframes/assets/fuentes/barlow-300.woff2);font-weight:300}
@font-face{font-family:B;src:url(../../rimu1/hyperframes/assets/fuentes/barlow-600.woff2);font-weight:600}
@font-face{font-family:BC;src:url(../../rimu1/hyperframes/assets/fuentes/barlowc-700.woff2);font-weight:700}
:root{--amb:#FFB547;--bg:#0B0C0E;--gris:#3A3F47;--gris2:#5B6068}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:#fff;font-family:B,sans-serif}
.f{position:absolute;inset:0;display:none}
.titulo{position:absolute;left:0;right:0;text-align:center;font-family:BC;font-weight:700;letter-spacing:2px}
/* el año en 12 meses */
.anio{position:absolute;left:60px;right:60px;top:330px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px 40px}
.mes b{display:block;font-weight:600;font-size:26px;color:var(--gris2);margin-bottom:8px;text-transform:lowercase}
.mes .c{display:grid;grid-template-columns:repeat(7,30px);gap:7px}
.mes i{width:30px;height:30px;border-radius:8px;border:2px solid var(--gris);display:block}
.mes i.v{border:none}
.mes i.a{background:var(--amb);border:none}
/* los tres hábitos con su casilla */
.tres{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:70px}
.hab{display:flex;flex-direction:column;align-items:center;gap:18px}
.hab svg{width:150px;height:150px}
.casilla{width:64px;height:64px;border-radius:16px;border:5px solid var(--gris2);display:grid;place-items:center}
.casilla.si{background:var(--amb);border-color:var(--amb)}
.casilla svg{width:44px;height:44px}
</style></head>
<body>

<!-- 1 · 4,9 s "sigues igual": el año entero gris -->
<section class="f" id="f1">
  <div class="titulo" style="top:110px;font-size:170px">DICIEMBRE</div>
  <div class="anio" data-modo="gris"></div>
  <div class="tres" style="top:1330px" data-color="#5B6068" data-casilla=""></div>
</section>

<!-- 2 · 6,3 s "Racha": los íconos grises se meten en el ícono -->
<section class="f" id="f2">
  <div style="position:absolute;left:340px;top:560px;width:400px;height:400px;border-radius:96px;overflow:hidden;transform:scale(1.06)"><img src="../../rimu1/hyperframes/assets/icono.svg" style="width:100%"></div>
  <div class="ic" style="left:96px;top:470px;transform:scale(.62) rotate(-18deg);opacity:.75"></div>
  <div class="ic" style="left:760px;top:420px;transform:scale(.5) rotate(14deg);opacity:.65"></div>
  <div class="ic" style="left:640px;top:980px;transform:scale(.42) rotate(-8deg);opacity:.55"></div>
  <div style="position:absolute;left:0;right:0;top:1040px;height:150px;overflow:hidden;text-align:center"><div style="font-family:BC;font-weight:700;font-size:150px;line-height:150px;transform:translateY(0)">Racha</div></div>
  </section>

<!-- 3 · 16,8 s "también cuenta": la versión pequeña, en la app de verdad -->
<section class="f" id="f3">
  <div style="position:absolute;left:330px;top:150px;display:flex;align-items:center;gap:26px">
    <div class="libro" style="width:110px;height:110px"></div>
    <div style="background:#fff;color:#0B0C0E;border-radius:999px;padding:12px 30px;font-weight:600;font-size:46px">1 página</div>
  </div>
  <div style="position:absolute;left:40px;top:420px;width:1000px;height:420px;border-radius:56px;border:10px solid #23262B;overflow:hidden;background:#0F1113">
    <img src="../../guion3/app/f-leer-marcado.png" style="position:absolute;width:1080px;left:15px;top:-871px">
  </div>
  <svg viewBox="0 0 24 24" style="position:absolute;left:390px;top:930px;width:300px;height:300px" fill="none" stroke="#FFB547" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  <div class="titulo" style="top:1250px;font-size:150px">TAMBIÉN <span style="color:var(--amb)">CUENTA</span></div>
</section>

<!-- 4 · 20,9 s "todo lo que sí hiciste": Tu año lleno (foto de prueba: va de marzo a octubre) -->
<section class="f" id="f4">
  <div class="titulo" style="top:150px;font-size:170px;color:var(--amb)">DICIEMBRE</div>
  <div style="position:absolute;left:30px;top:470px;width:1020px;height:560px;border-radius:44px;overflow:hidden;border:2px solid #23262B">
    <img src="../../app-llenado/ventanas/anio-112.png" style="position:absolute;height:600px;left:-830px;top:-20px">
  </div>
  <div class="tres" style="top:1130px" data-color="#FFB547" data-casilla="si"></div>
</section>

<script>
const ICON = {
  libro: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  pesa: '<path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/>',
  alcancia: '<path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/><path d="M16 10h.01"/><path d="M2 8v1a2 2 0 0 0 2 2h1"/>',
  chulo: '<path d="M20 6 9 17l-5-5"/>'
};
const svg = (k, color, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
// los 12 meses de 2026 (el 1 de enero de 2026 es jueves; la semana empieza el lunes)
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
document.querySelectorAll('.anio').forEach((a) => {
  a.innerHTML = MESES.map((m, k) => {
    const dias = new Date(2026, k + 1, 0).getDate(), inicio = (new Date(2026, k, 1).getDay() + 6) % 7;
    let c = '';
    for (let n = 0; n < 35; n++) { const d = n - inicio + 1; c += `<i class="${d < 1 || d > dias ? 'v' : ''}"></i>`; }
    return `<div class="mes"><b>${m}</b><div class="c">${c}</div></div>`;
  }).join('');
});
document.querySelectorAll('.tres').forEach((t) => {
  const col = t.dataset.color, si = t.dataset.casilla;
  t.innerHTML = ['libro', 'pesa', 'alcancia'].map((k) => `<div class="hab">${svg(k, col)}<div class="casilla ${si}">${si ? svg('chulo', '#0B0C0E', 3.4) : ''}</div></div>`).join('');
});
document.querySelectorAll('#f2 .ic').forEach((e, i) => { e.style.position = 'absolute'; e.style.width = e.style.height = '230px'; e.innerHTML = svg(['libro', 'pesa', 'alcancia'][i], '#6B7079'); });
document.querySelector('.libro').innerHTML = svg('libro', '#FFB547', 2);
document.getElementById(location.hash.slice(1) || 'f1').style.display = 'block';
</script>
</body></html>
