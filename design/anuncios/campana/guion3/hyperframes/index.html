<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Racha · campaña · guion 3 · el día malo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .clip { position: absolute; inset: 0; }
      .escena { z-index: 1; }
      #cel { position: absolute; left: 0; top: 0; z-index: 2; width: 886px; height: 1788px; padding: 14px; border-radius: 104px; background: #24272D; box-shadow: 0 0 0 4px #0F1113, 26px 30px 0 rgba(15, 17, 19, 0.9); transform-origin: 0 0; opacity: 0; visibility: hidden; }
      #cel-pantalla { position: relative; width: 100%; height: 100%; border-radius: 90px; overflow: hidden; background: #0F1113; }
      #cel-video { width: 100%; height: 100%; object-fit: cover; }
      #l3 { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="22.68" data-width="1080" data-height="1920">
      <!-- Las escenas, una detrás de otra, con corte seco -->
      <div id="e1" class="clip escena" data-composition-id="e1" data-composition-src="compositions/e1.html" data-start="0" data-duration="2.22" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="e2" class="clip escena" data-composition-id="e2" data-composition-src="compositions/e2.html" data-start="2.22" data-duration="3.95" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="f3" class="clip escena" data-composition-id="f3" data-composition-src="compositions/f3.html" data-start="6.17" data-duration="9.52" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="e6" class="clip escena" data-composition-id="e6" data-composition-src="compositions/e6.html" data-start="15.69" data-duration="2.89" data-track-index="0" data-width="1080" data-height="1920"></div>
      <div id="cierre" class="clip escena" data-composition-id="cierre" data-composition-src="compositions/cierre.html" data-start="18.58" data-duration="4.1" data-track-index="0" data-width="1080" data-height="1920"></div>

      <!-- El celular con la app en movimiento (la grabación empieza en el segundo 6 del anuncio) -->
      <div id="cel" data-layout-allow-overflow>
        <div id="cel-pantalla">
          <video id="cel-video" class="clip" src="assets/celular.mp4" playsinline muted data-start="6.17" data-duration="9.52" data-media-start="0.17" data-track-index="2"></video>
        </div>
      </div>

      <!-- Los letreros que van encima del celular -->
      <div id="l3" class="clip" data-composition-id="l3" data-composition-src="compositions/l3.html" data-start="6.17" data-duration="9.52" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- La voz (Linda Gomez, ElevenLabs) y la música, que ya viene bajita -->
      <audio id="voz" src="assets/voz.wav" data-start="0.2" data-duration="19.39" data-media-start="0" data-track-index="3" data-volume="1"></audio>
      <audio id="musica" src="assets/musica.wav" data-start="0" data-duration="22.68" data-media-start="0" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // El celular sube, y después se acerca a lo que la voz va nombrando
      tl.fromTo("#cel", { autoAlpha: 1, x: 97, y: 1960, scale: 1, rotation: 7 }, { x: 97, y: 687, scale: 1, autoAlpha: 1, rotation: -1.5, duration: 0.7, ease: "power3.out" }, 6.17);
      tl.to("#cel", { x: 43.84, y: 17.264, scale: 1.12, rotation: 1, duration: 0.6, ease: "power2.inOut" }, 8.319);
      tl.to("#cel", { x: -35.9, y: -155.14, scale: 1.3, rotation: -1, duration: 0.5, ease: "power2.inOut" }, 10.21);
      tl.to("#cel", { x: 43.84, y: 103.36, scale: 1.12, rotation: 1, duration: 0.6, ease: "power2.inOut" }, 12.002);
      tl.to("#cel", { x: -35.9, y: -53.6, scale: 1.3, rotation: -1, duration: 0.45, ease: "back.out(1.4)" }, 13.212);
      tl.set("#cel", { autoAlpha: 0 }, 15.69);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
