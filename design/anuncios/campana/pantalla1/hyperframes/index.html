<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Racha · campaña · pantalla 1</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .clip { position: absolute; inset: 0; }
      #cuerpo { width: 100%; height: 100%; object-fit: cover; z-index: 1; }
      #frase { z-index: 2; }
      #cierre { z-index: 3; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1080" data-height="1920">
      <!-- Los 12 cortes ya unidos: 6 de Luis y 6 de la pantalla, de 1.2 s cada uno -->
      <video id="cuerpo" class="clip" src="assets/cuerpo.mp4" playsinline muted data-start="0" data-duration="14.4" data-media-start="0" data-track-index="0"></video>

      <!-- La frase fija de arriba -->
      <div id="frase" class="clip" data-composition-id="frase" data-composition-src="compositions/frase.html" data-start="0" data-duration="14.4" data-track-index="1" data-width="1080" data-height="1920"></div>

      <!-- La tarjeta final: entra en el primer golpe de un compás -->
      <div id="cierre" class="clip" data-composition-id="cierre" data-composition-src="compositions/cierre.html" data-start="14.4" data-duration="4.2" data-track-index="2" data-width="1080" data-height="1920"></div>

      <!-- La música -->
      <audio id="musica" src="assets/musica.wav" data-start="0" data-duration="18.6" data-media-start="0" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
