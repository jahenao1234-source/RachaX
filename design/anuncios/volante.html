<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Anuncio de Racha · volante de oferta (con la app y las guías reales)</title>
<style>
@font-face{font-family:'Barlow';font-weight:600;src:url('../../public/fuentes/barlow-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;src:url('../../public/fuentes/barlow-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'BarlowC';font-weight:700;src:url('../../public/fuentes/barlow-condensed-latin-700-normal.woff2') format('woff2')}
*{box-sizing:border-box}
html,body{margin:0;background:#333}
body{font-family:'BarlowC','Barlow',sans-serif;display:flex;flex-wrap:wrap;gap:16px;padding:16px}
.ad{width:540px;height:675px;position:relative;overflow:hidden;background:#050505;color:#fff}
.rayos{position:absolute;inset:-40%;background:repeating-conic-gradient(from 3deg at 50% 47%,rgba(255,165,40,.95) 0 1.1deg,transparent 1.1deg 9deg);-webkit-mask:radial-gradient(circle at 50% 47%,transparent 0 30%,#000 62%);mask:radial-gradient(circle at 50% 47%,transparent 0 30%,#000 62%)}
.brillo{position:absolute;left:50%;top:262px;width:430px;height:330px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,150,30,.6),rgba(255,150,30,0))}
.tit{position:absolute;left:14px;right:14px;top:14px;background:#FFB547;color:#0b0b0d;border:3px solid #fff;border-radius:12px;font-weight:700;font-size:34px;line-height:.98;text-transform:uppercase;text-align:center;padding:10px 10px 9px;letter-spacing:.005em;box-shadow:0 5px 0 rgba(0,0,0,.5);height:92px;display:grid;place-items:center;text-wrap:balance}
.gar{position:absolute;left:0;right:0;top:116px;text-align:center;font-weight:700;font-size:25px;line-height:1;color:#FFE600;text-transform:uppercase;transform:rotate(-1.5deg);text-shadow:3px 3px 0 #000;white-space:nowrap}
.sello{display:none}
.sello small{display:block;font-size:13px;letter-spacing:.06em}
.guia{position:absolute;width:104px;height:184px;border-radius:5px;overflow:hidden;border:3px solid #fff;box-shadow:8px 9px 0 rgba(0,0,0,.65)}
.guia img{width:100%;height:100%;object-fit:cover;display:block}
.g1{left:92px;top:176px;transform:rotate(-13deg)}
.g2{right:92px;top:176px;transform:rotate(13deg)}
.tel{position:absolute;left:50%;top:150px;width:118px;height:232px;margin-left:-59px;border-radius:20px;border:5px solid #1b2530;background:#000;overflow:hidden;transform:rotate(5deg);box-shadow:0 0 0 2px #54606c,12px 14px 22px rgba(0,0,0,.75)}
.tel img{width:100%;display:block}
.noes{position:absolute;left:30px;right:30px;top:390px;background:#FFB547;color:#0b0b0d;border-radius:9px;font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;text-align:center;padding:7px 6px 6px;box-shadow:0 4px 0 rgba(0,0,0,.55);white-space:nowrap}
ul{position:absolute;left:38px;right:14px;top:437px;margin:0;padding:0;list-style:none;columns:2;column-gap:8px;font-weight:700;font-size:19px;line-height:1.16}
li{position:relative;padding:0 0 2px 26px;break-inside:avoid;text-shadow:2px 2px 0 #000;white-space:nowrap}
li:before{content:"✓";position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:#22C55E;color:#fff;font-size:14px;line-height:20px;text-align:center;text-shadow:none}
.solo{position:absolute;left:0;right:0;top:508px;text-align:center;font-weight:700;font-size:20px;line-height:1;letter-spacing:.06em}
.precio{position:absolute;left:0;right:0;top:524px;text-align:center;font-weight:700;font-size:92px;line-height:.9;color:#FFE600;letter-spacing:-.01em;text-shadow:5px 5px 0 #B91C1C,0 0 26px rgba(0,0,0,.9)}
.pago{position:absolute;left:50%;top:603px;transform:translateX(-50%) rotate(-3deg);background:#E11D2E;color:#fff;font-weight:700;font-size:21px;line-height:1;text-transform:uppercase;padding:5px 12px 4px;white-space:nowrap;box-shadow:3px 4px 0 rgba(0,0,0,.6)}
.wa{position:absolute;left:60px;right:60px;bottom:0;background:#22C55E;color:#fff;border-radius:14px 14px 0 0;font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;padding:8px 10px 7px;display:flex;align-items:center;justify-content:center;gap:9px;text-shadow:1px 2px 0 rgba(0,0,0,.35)}
.inm{position:absolute;right:12px;top:578px;background:#FFB547;color:#0b0b0d;border-radius:7px;font-weight:700;font-size:15px;line-height:1;padding:5px 8px 4px;text-transform:uppercase;transform:rotate(4deg)}
.et{position:absolute;left:0;top:-22px;color:#fff;font:700 15px Barlow}
</style>
</head>
<body>
<template id="base">
  <div class="rayos"></div><div class="brillo"></div>
  <div class="tit">TITULO</div>
  <div class="gar">Acceso vitalicio · 7 días de garantía</div>
  <div class="sello"><span><small>un solo pago</small>Sin<br>mensua-<br>lidad</span></div>
  <div class="guia g1"><img src="recursos/portada-metodo.png" alt=""></div>
  <div class="guia g2"><img src="recursos/portada-rescate.png" alt=""></div>
  <div class="tel"><img src="recursos/app-hoy.png" alt=""></div>
  <div class="noes">No es un PDF: es una app para tu celular</div>
  <ul>
    <li>App para Android, iPhone y PC</li>
    <li>Guía Método Anti-Abandono</li>
    <li>Guía Protocolo de Rescate</li>
    <li>6 rutinas ya armadas</li>
    <li>18 tareas paso a paso</li>
    <li>5 planes de 30 días</li>
  </ul>
  <div class="solo">POR SOLO</div>
  <div class="precio">$37.900</div>
  <div class="pago">Un solo pago · sin mensualidad</div>
  <div class="inm">Acceso inmediato</div>
  <div class="wa"><svg width="26" height="26" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5.100-1.300A10 10 0 1 0 12 2zm0 2a8 8 0 1 1-4.100 14.900l-.4-.2-2.700.7.7-2.600-.3-.4A8 8 0 0 1 12 4zm-3.200 3.600c-.2 0-.5 0-.8.4-.3.300-1 1-1 2.400s1 2.800 1.200 3c.1.200 2 3.200 5 4.400 2.500 1 3 .8 3.500.7.500 0 1.700-.7 2-1.400.2-.7.2-1.200.1-1.400l-.5-.3-1.800-.9c-.2-.1-.4-.1-.6.100l-.8 1c-.1.200-.3.200-.5.100-.3-.1-1.200-.4-2.200-1.400-.8-.7-1.400-1.600-1.500-1.900-.2-.3 0-.4.100-.5l.4-.5.300-.4c.1-.2 0-.4 0-.5l-.8-2c-.2-.5-.4-.4-.6-.5z"/></svg>Escríbeme y te la muestro</div>
</template>
<section class="ad" id="volante-A" data-t="La app para no volver a empezar de cero"></section>
<section class="ad" id="volante-B" data-t="Hábitos, tareas y foco: todo en una sola app"></section>
<section class="ad" id="volante-C" data-t="La app para el día que no puedes con nada"></section>
<script>
document.querySelectorAll('.ad').forEach((ad) => {
  ad.innerHTML = document.getElementById('base').innerHTML.replace('TITULO', ad.dataset.t);
});
</script>
</body>
</html>
