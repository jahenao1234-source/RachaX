*{box-sizing:border-box}
body{margin:0;background:#060708;font-family:'Barlow',system-ui,sans-serif;padding:32px 16px;display:flex;flex-direction:column;align-items:center;gap:28px}
.cond{font-family:'Barlow Condensed',sans-serif;font-weight:700}
.dark{--bg:#0F1113;--surface:#181B1F;--text:#F1F3F5;--muted:#98A0AA;--line:#2A2F36;--hearth:#1A1410;--hearth2:#3A2A16;--ring:#FFB547}

.board{width:390px;border-radius:28px;background:var(--bg);color:var(--text);padding:20px 16px;outline:1px solid #22262C}
.board h2{margin:0 0 4px;font-size:24px}
.board p.sub{margin:0 0 14px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.grid.m{grid-template-columns:repeat(4,1fr)}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
figcaption{font-size:12px;color:var(--muted);line-height:1.3}
figcaption b{display:block;color:var(--text);font-size:14px}
.row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.big{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
h1{color:#fff;font-family:'Barlow Condensed',sans-serif;margin:0}
